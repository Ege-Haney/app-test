<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kapalı, açık ve yarı açık aralıkların toplamını hesaplayın."
    />
    <title>Aralık Toplamı</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #19231f;
        background: #f3f5f1;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        background:
          radial-gradient(ellipse at 10% 5%, #dce9d9 0, transparent 38%),
          #f3f5f1;
      }

      main {
        width: min(100%, 540px);
        padding: clamp(26px, 6vw, 48px);
        border: 1px solid #e2e8e0;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 24px 70px #253b2a12;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #57725a;
        font-size: 0.76rem;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 2.8rem);
        letter-spacing: -0.055em;
        line-height: 1.08;
      }

      .intro {
        margin: 14px 0 30px;
        color: #66716a;
        line-height: 1.6;
      }

      form {
        display: grid;
        gap: 20px;
      }

      .number-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 8px;
        color: #37443b;
        font-size: 0.9rem;
        font-weight: 650;
      }

      input[type="text"] {
        width: 100%;
        min-height: 48px;
        padding: 0 13px;
        border: 1px solid #dce3dc;
        border-radius: 10px;
        outline: none;
        background: #fbfcfa;
        color: #19231f;
        font: inherit;
      }

      input[type="text"]:focus {
        border-color: #527957;
        box-shadow: 0 0 0 3px #52795720;
      }

      fieldset {
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }

      legend {
        margin-bottom: 9px;
        color: #37443b;
        font-size: 0.9rem;
        font-weight: 650;
      }

      .range-choices {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .range-choice {
        min-height: 64px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border: 1px solid #dce3dc;
        border-radius: 10px;
        background: #fbfcfa;
        cursor: pointer;
        line-height: 1.4;
      }

      .range-choice:has(input:checked) {
        border-color: #527957;
        background: #f1f6ef;
        box-shadow: 0 0 0 1px #527957;
      }

      .range-choice input {
        width: 17px;
        height: 17px;
        flex: 0 0 auto;
        margin: 0;
        accent-color: #315d3a;
      }

      .range-choice:focus-within {
        outline: 3px solid #52795740;
        outline-offset: 2px;
      }

      .field-help {
        margin: -12px 0 0;
        color: #7a847d;
        font-size: 0.8rem;
      }

      button {
        min-height: 50px;
        border: 0;
        border-radius: 11px;
        background: #315d3a;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        transition: background 140ms ease, transform 140ms ease;
      }

      button:hover {
        background: #264d2e;
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 3px solid #8cae8e;
        outline-offset: 3px;
      }

      .result {
        min-height: 96px;
        margin-top: 24px;
        padding: 18px 20px;
        border: 1px solid #e0e9df;
        border-radius: 14px;
        background: #f5f8f3;
      }

      .result-label {
        display: block;
        margin-bottom: 7px;
        color: #627166;
        font-size: 0.8rem;
        font-weight: 650;
      }

      output {
        display: block;
        overflow-wrap: anywhere;
        color: #244c2e;
        font-size: clamp(1.65rem, 6vw, 2.25rem);
        font-variant-numeric: tabular-nums;
        font-weight: 750;
        letter-spacing: -0.04em;
      }

      .error {
        margin: 12px 0 0;
        color: #a33434;
        font-size: 0.9rem;
      }

      @media (max-width: 420px) {
        .number-fields {
          grid-template-columns: 1fr;
        }

        .range-choices {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Basit hesaplayıcı</p>
      <h1>Aralık toplamı</h1>
      <p class="intro">
        Başlangıç ve bitiş sayılarını girin, ardından hangi aralık türünü
        toplamak istediğinizi seçin.
      </p>

      <form id="calculator">
        <div class="number-fields">
          <label for="start">Başlangıç sayısı
            <input id="start" name="start" type="text" inputmode="numeric" placeholder="Örn. 1" required />
          </label>
          <label for="end">Bitiş sayısı
            <input id="end" name="end" type="text" inputmode="numeric" placeholder="Örn. 10" required />
          </label>
        </div>
        <p class="field-help">Tam sayı girin; negatif sayılar da kullanılabilir.</p>

        <fieldset>
          <legend>Aralık türü</legend>
          <div class="range-choices">
            <label class="range-choice">
              <input type="radio" name="rangeType" value="closed" checked />
              <span>Kapalı — iki uç dahil [a, b]</span>
            </label>
            <label class="range-choice">
              <input type="radio" name="rangeType" value="open" />
              <span>Açık — iki uç hariç (a, b)</span>
            </label>
            <label class="range-choice">
              <input type="radio" name="rangeType" value="half-open-start" />
              <span>Baştan açık — başlangıç hariç (a, b]</span>
            </label>
            <label class="range-choice">
              <input type="radio" name="rangeType" value="half-open-end" />
              <span>Sondan açık — bitiş hariç [a, b)</span>
            </label>
          </div>
        </fieldset>

        <button type="submit">Toplamı hesapla</button>
      </form>

      <section class="result" aria-live="polite" aria-atomic="true">
        <span class="result-label">Sonuç</span>
        <output id="result">—</output>
      </section>
      <p id="error" class="error" role="alert" hidden></p>
    </main>

    <script>
      const form = document.querySelector("#calculator");
      const result = document.querySelector("#result");
      const error = document.querySelector("#error");
      const integerPattern = /^[+-]?\d+$/;

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        error.hidden = true;
        result.textContent = "—";

        const startText = form.elements.start.value.trim();
        const endText = form.elements.end.value.trim();
        if (!integerPattern.test(startText) || !integerPattern.test(endText)) {
          error.textContent = "Lütfen başlangıç ve bitiş için geçerli birer tam sayı girin.";
          error.hidden = false;
          return;
        }

        const start = BigInt(startText);
        const end = BigInt(endText);
        let first = start;
        let stop = end + 1n;

        const rangeType = form.elements.rangeType.value;
        if (rangeType === "open") {
          first = start + 1n;
          stop = end;
        } else if (rangeType === "half-open-start") {
          first = start + 1n;
        } else if (rangeType === "half-open-end") {
          stop = end;
        }

        const count = stop > first ? stop - first : 0n;
        const sum = count === 0n ? 0n : (first + stop - 1n) * count / 2n;
        result.textContent = sum.toString();
      });
    </script>
  </body>
</html>
